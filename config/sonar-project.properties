# ==============================================================================
# SonarQube Project Configuration
# Reference: https://docs.sonarsource.com/sonarqube/latest/project-administration/narrowing-the-focus/
# ==============================================================================

# Unique Project Key and Name in SonarQube
sonar.projectKey=my-startup-project
sonar.projectName=My Startup Core Service
sonar.projectVersion=1.0.0

# Source Code Locations
sonar.sources=src,lib,app,scripts
sonar.sourceEncoding=UTF-8

# Test Code Locations
sonar.tests=tests,test,__tests__,spec
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.jsx,**/*.test.tsx,**/*.spec.js,**/*.spec.ts,**/test_*.py

# ==============================================================================
# CRITICAL PERFORMANCE TUNING: EXCLUSIONS
# (Prevents 20-minute CI scans by skipping third-party libraries & build artifacts)
# ==============================================================================
sonar.exclusions=\
  **/node_modules/**,\
  **/bower_components/**,\
  **/vendor/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/.nuxt/**,\
  **/out/**,\
  **/coverage/**,\
  **/.nyc_output/**,\
  **/.git/**,\
  **/.github/**,\
  **/.turbo/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.bundle.js,\
  **/*.map,\
  **/*.json,\
  **/*.svg,\
  **/*.png,\
  **/*.jpg,\
  **/*.lock,\
  **/package-lock.json,\
  **/yarn.lock,\
  **/pnpm-lock.yaml

# Duplication Analysis: Ignore test files and generated files from duplication check
sonar.cpd.exclusions=\
  tests/**,\
  test/**,\
  **/*.test.*,\
  **/*.spec.*,\
  docs/**

# Coverage Report Paths (Uncomment according to your stack)
# JavaScript / TypeScript LCOV report:
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Python Coverage report:
# sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate Methodology: Clean as You Code reference branch
# In PRs, issues are calculated against this reference branch
sonar.newCode.referenceBranch=main
