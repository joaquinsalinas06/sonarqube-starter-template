services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SONAR_DOMAIN=${SONAR_DOMAIN:-localhost}
      - CADDY_LETSENCRYPT_EMAIL=${CADDY_LETSENCRYPT_EMAIL:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sonarqube:
        condition: service_healthy
    networks:
      - sonarnet

  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:${SONARQUBE_VERSION:-10.6.0.92116-community}
    container_name: sonarqube_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-sonar}
      - SONAR_JDBC_USERNAME=${POSTGRES_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD:-ChangeThisToAStrongPassword123!}
      - SONAR_SEARCH_JAVAADDITIONALOPTS=${SONAR_SEARCH_JAVAADDITIONALOPTS:--Dnode.store.allow_mmap=true -Xms1024m -Xmx1024m}
      - SONAR_WEB_JAVAADDITIONALOPTS=${SONAR_WEB_JAVAADDITIONALOPTS:--Xms512m -Xmx1024m}
      - SONAR_CE_JAVAADDITIONALOPTS=${SONAR_CE_JAVAADDITIONALOPTS:--Xms512m -Xmx1024m}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
      memlock: -1
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: sonarqube_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sonar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeThisToAStrongPassword123!}
      - POSTGRES_DB=${POSTGRES_DB:-sonar}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - sonarnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
  caddy_data:
  caddy_config:

networks:
  sonarnet:
    name: sonarnet
    driver: bridge
